<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higor-Dev</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="hearts"></div>

    <main class="container">

        <div class="content">
            <p class="small-text"></p>

            <h1>GUILHERME & INGRID ❤️</h1>

            <div class="photo-container">
                <img src="lara.jpeg" alt="Nossa foto">
            </div>

            <h2>Juntos há</h2>

            <div class="counter">
                <div class="time-box">
                    <span id="years">0</span>
                    <small>anos</small>
                </div>

                <div class="time-box">
                    <span id="months">0</span>
                    <small>meses</small>
                </div>

                <div class="time-box">
                    <span id="days">0</span>
                    <small>dias</small>
                </div>

                <div class="time-box">
                    <span id="hours">0</span>
                    <small>horas</small>
                </div>

                <div class="time-box">
                    <span id="minutes">0</span>
                    <small>min</small>
                </div>

                <div class="time-box">
                    <span id="seconds">0</span>
                    <small>seg</small>
                </div>
            </div>

            <p class="message">
                Desenvolvido Por Higor 👽🛸
            </p>

            <div class="heart"></div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
